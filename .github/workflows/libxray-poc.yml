name: libXray Android build and real VPN E2E (Phase 3)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/libxray-poc.yml"
      - "scripts/inspect_libxray_aar.sh"
      - "scripts/e2e/**"
      - "app/src/main/java/com/onfaa/tunnel/core/xray/**"
      - "app/src/main/java/com/onfaa/tunnel/vpn/**"
      - "app/src/main/java/com/onfaa/tunnel/data/config/**"
      - "app/src/main/java/com/onfaa/tunnel/domain/model/**"
      - "app/src/main/java/com/onfaa/tunnel/feature/**"
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/androidTest/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - "gradle/**"

permissions:
  contents: read

env:
  LIBXRAY_REPO: https://github.com/XTLS/libXray.git
  LIBXRAY_TAG: v26.11.9
  LIBXRAY_COMMIT: 5a0f7d8d1c28b34afb5727b04b26a10f6dbac7e3
  XRAY_CORE_TAG: v26.11.9
  XRAY_CORE_COMMIT: 676eaf66f8f05d4d558ee7a74b4736623d3feeb9
  # Exact NDK r30 stable package from the official Android SDK repository
  # (repository2-3.xml: ndk;30.0.16248370 = NDK r30, non-preview).
  NDK_PACKAGE: "ndk;30.0.16248370"
  NDK_VERSION: "30.0.16248370"
  LIBXRAY_ANDROID_API: "21"
  # Pinned for reproducibility of gomobile tool resolution (build script resolves LIBXRAY_GOMOBILE_VERSION).
  LIBXRAY_GOMOBILE_VERSION: v0.0.0-20260217195705-b56b3793a9c4
  GO_VERSION: "1.26.1"
  # Deterministic E2E fixture (test-only credential, never a real user secret).
  E2E_DIR: /tmp/onfaa-e2e
  E2E_UUID: "11111111-1111-4111-8111-111111111111"
  E2E_TOKEN: "onfaa-e2e-token-phase3"
  E2E_VLESS_PORT: "18443"
  E2E_VMESS_PORT: "18444"
  E2E_HTTP_PORT: "18080"
  E2E_DNS_PORT: "15353"
  E2E_ANSWER_IP: "192.0.2.10"

jobs:
  build-libxray-and-integrate:
    name: Build libXray, inspect AAR, integrate and build app
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout ONFAA TUNNEL
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Go (pinned)
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

      - name: Install pinned Android NDK r30 via official sdkmanager
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK not found at $SDK"; exit 1; }
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK" "$NDK_PACKAGE"
          NDK_PATH="$SDK/ndk/$NDK_VERSION"
          test -x "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            || { echo "NDK clang missing at $NDK_PATH"; exit 1; }
          "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ndk-path=$NDK_PATH" >> "$GITHUB_OUTPUT"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$NDK_PATH" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone and verify libXray pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "$LIBXRAY_REPO" /tmp/libXray
          cd /tmp/libXray
          git fetch --tags --depth=1 origin "$LIBXRAY_TAG"
          git checkout "$LIBXRAY_COMMIT"
          ACTUAL="$(git rev-parse HEAD)"
          echo "libXray HEAD: $ACTUAL"
          test "$ACTUAL" = "$LIBXRAY_COMMIT"
          git --no-pager show -s --format='%H %s' HEAD | tee "$GITHUB_WORKSPACE/libxray-commit.txt"

      - name: Build libXray Android AAR (official script)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          cd /tmp/libXray
          echo "Go: $(go version)"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          python3 build/main.py android
          test -f libXray.aar
          test -f libXray-sources.jar || true
          ls -lh libXray.aar libXray-sources.jar 2>/dev/null || true

      - name: Inspect AAR and generate PoC report
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/inspect_libxray_aar.sh
          ./scripts/inspect_libxray_aar.sh /tmp/libXray/libXray.aar "$GITHUB_WORKSPACE/poc-report"
          cp /tmp/libXray/libXray.aar "$GITHUB_WORKSPACE/poc-report/libXray.aar"
          cp /tmp/libXray/libXray-sources.jar "$GITHUB_WORKSPACE/poc-report/libXray-sources.jar" 2>/dev/null || true
          echo "LIBXRAY_AAR_SHA256=$(cut -d' ' -f1 "$GITHUB_WORKSPACE/poc-report/aar.sha256")" >> "$GITHUB_ENV"

      - name: Integrate verified AAR into :app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          cp /tmp/libXray/libXray.aar app/libs/libXray.aar
          sha256sum app/libs/libXray.aar | tee "$GITHUB_WORKSPACE/poc-report/app-libs-aar.sha256"

      - name: Verify AAR contains native libs and Invoke binding
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/poc-report"
          test -s "$REPORT/abis.txt" && echo "ABIs detected" || (echo "No ABIs detected" && exit 1)
          grep -qi "invoke" "$REPORT/javap.txt"
          test -s "$REPORT/invoke_signature.txt"
          grep -q "java.lang.String invoke(java.lang.String)" "$REPORT/invoke_signature.txt"
          grep -qx "ELF_ARCH_OK" "$REPORT/elf_arch_check.txt"
          grep -qx "ALL_LOAD_ALIGNED_16K" "$REPORT/sixteen_kb.txt"

      - name: Build pinned official Xray-core server for E2E
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          mkdir -p "$E2E_DIR"
          rm -rf /tmp/Xray-core
          git clone --no-checkout https://github.com/XTLS/Xray-core.git /tmp/Xray-core
          cd /tmp/Xray-core
          git fetch --tags --depth=1 origin "$XRAY_CORE_TAG"
          git checkout "$XRAY_CORE_COMMIT"
          ACTUAL="$(git rev-parse HEAD)"
          echo "Xray-core HEAD: $ACTUAL"
          test "$ACTUAL" = "$XRAY_CORE_COMMIT"
          git --no-pager show -s --format='%H %s' HEAD | tee "$GITHUB_WORKSPACE/xray-core-commit.txt"
          go build -trimpath -o "$E2E_DIR/xray" ./main
          "$E2E_DIR/xray" version | tee "$E2E_DIR/xray-version.txt"

      - name: Start official Xray server and deterministic E2E responders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$E2E_DIR"
          sudo ip addr add "$E2E_ANSWER_IP/32" dev lo
          python3 scripts/e2e/onfaa_e2e_services.py \
            --http-bind "$E2E_ANSWER_IP" --http-port "$E2E_HTTP_PORT" \
            --dns-bind 127.0.0.1 --dns-port "$E2E_DNS_PORT" \
            --answer-ip "$E2E_ANSWER_IP" --token "$E2E_TOKEN" \
            > "$E2E_DIR/services.log" 2>&1 &
          echo $! > "$E2E_DIR/services.pid"
          cat > "$E2E_DIR/server.json" <<EOF
          {
            "log": {"loglevel": "info", "access": "$E2E_DIR/access.log"},
            "inbounds": [
              {
                "tag": "vless-in",
                "listen": "127.0.0.1",
                "port": $E2E_VLESS_PORT,
                "protocol": "vless",
                "settings": {
                  "clients": [{"id": "$E2E_UUID"}],
                  "decryption": "none"
                }
              },
              {
                "tag": "vmess-in",
                "listen": "127.0.0.1",
                "port": $E2E_VMESS_PORT,
                "protocol": "vmess",
                "settings": {
                  "clients": [{"id": "$E2E_UUID"}]
                }
              }
            ],
            "outbounds": [{"protocol": "freedom", "tag": "direct"}]
          }
          EOF
          "$E2E_DIR/xray" -test -c "$E2E_DIR/server.json"
          "$E2E_DIR/xray" -c "$E2E_DIR/server.json" > "$E2E_DIR/xray-server.log" 2>&1 &
          echo $! > "$E2E_DIR/xray.pid"
          python3 - <<'PY'
          import socket, time
          for port in (18443, 18444):
              for _ in range(50):
                  try:
                      socket.create_connection(("127.0.0.1", port), 1).close()
                      break
                  except OSError:
                      time.sleep(0.2)
              else:
                  raise SystemExit(f"port {port} not listening")
          PY
          curl -fsS "http://$E2E_ANSWER_IP:$E2E_HTTP_PORT/token" | tee "$E2E_DIR/token.txt"
          test "$(cat "$E2E_DIR/token.txt")" = "$E2E_TOKEN"
          echo "E2E servers ready: Xray $E2E_VLESS_PORT/$E2E_VMESS_PORT, token $E2E_HTTP_PORT, DNS $E2E_DNS_PORT"

      - name: Publish PoC evidence to log and job summary
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/poc-report"
          {
            echo "## libXray Phase 2B — preuves d'exécution"
            echo ""
            echo "- Commit ONFAA : \`$GITHUB_SHA\`"
            echo "- Commit libXray vérifié : \`$(cat "$GITHUB_WORKSPACE/libxray-commit.txt" 2>/dev/null || echo 'n/a')\`"
            echo "- Go : \`$(go version)\`"
            echo "- NDK : \`$ANDROID_NDK_HOME\`"
            echo ""
            echo "### SHA-256 AAR"
            echo '```'
            cat "$REPORT/aar.sha256"
            if [[ -f "$REPORT/aar.size.txt" ]]; then cat "$REPORT/aar.size.txt"; fi
            echo '```'
            echo "### ABIs présentes"
            echo '```'
            cat "$REPORT/abis.txt"
            echo '```'
            echo "### Fichiers natifs"
            echo '```'
            cat "$REPORT/jni.files.txt"
            echo '```'
            echo "### Architectures ELF par ABI"
            echo '```'
            cat "$REPORT/elf_arch_full.txt" 2>/dev/null || echo "n/a"
            echo '```'
            echo "### Alignement 16 KiB (segments LOAD)"
            echo '```'
            cat "$REPORT/sixteen_kb.txt" 2>/dev/null || echo "n/a"
            echo '```'
            echo "### Dépendances natives (NEEDED)"
            echo '```'
            cat "$REPORT/needed_libs.txt" 2>/dev/null || echo "n/a"
            echo '```'
            echo "### Signatures JVM contenant invoke"
            echo '```'
            cat "$REPORT/invoke_matches.txt" 2>/dev/null || echo "n/a"
            echo '```'
            echo "### Signature JVM exacte de l'entrée libXray"
            echo '```'
            cat "$REPORT/libXray_class.txt" 2>/dev/null || echo "n/a"
            echo '```'
            echo "### go.Seq (chargement runtime Go)"
            echo '```'
            cat "$REPORT/go_Seq.txt" 2>/dev/null || echo "n/a"
            echo '```'
            echo "### Classes JVM générées (extrait)"
            echo '```'
            head -80 "$REPORT/classes.list.txt" 2>/dev/null || echo "n/a"
            echo '```'
            echo "### Segments LOAD (extrait)"
            echo '```'
            head -60 "$REPORT/load_segments.txt" 2>/dev/null || echo "n/a"
            echo '```'
          } | tee "$REPORT/summary.md"
          cat "$REPORT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Run app unit tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK with integrated libXray
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble androidTest APK (real-artifact instrumented tests compiled)
        shell: bash
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM for the Android emulator
        shell: bash
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real-artifact instrumented tests on emulator (x86_64, API 35)
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb shell settings put global private_dns_mode off
            adb shell appops set com.onfaa.tunnel ACTIVATE_VPN allow || true
            ./gradlew :app:connectedDebugAndroidTest --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.onfaa.e2e=true \
              -Pandroid.testInstrumentationRunnerArguments.onfaa.e2e.uuid="$E2E_UUID" \
              -Pandroid.testInstrumentationRunnerArguments.onfaa.e2e.host="10.0.2.2" \
              -Pandroid.testInstrumentationRunnerArguments.onfaa.e2e.vlessPort="$E2E_VLESS_PORT" \
              -Pandroid.testInstrumentationRunnerArguments.onfaa.e2e.vmessPort="$E2E_VMESS_PORT" \
              -Pandroid.testInstrumentationRunnerArguments.onfaa.e2e.dns="10.0.2.2:$E2E_DNS_PORT" \
              -Pandroid.testInstrumentationRunnerArguments.onfaa.e2e.probeUrl="http://onfaa.test:$E2E_HTTP_PORT/token" \
              -Pandroid.testInstrumentationRunnerArguments.onfaa.e2e.token="$E2E_TOKEN"

      - name: Publish instrumented test results to job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/poc-report"
          mkdir -p "$REPORT"
          {
            echo ""
            echo "## Tests instrumentés réels (émulateur x86_64 API 35)"
            echo '```'
            FOUND=0
            while IFS= read -r f; do
              FOUND=1
              grep -h "<testsuite " "$f"
            done < <(find app/build/outputs/androidTest-results -name '*.xml' 2>/dev/null | sort)
            if [ "$FOUND" -eq 0 ]; then echo "NO_INSTRUMENTED_RESULTS"; fi
            echo '```'
          } > "$REPORT/instrumented-summary.md"
          cat "$REPORT/instrumented-summary.md" | tee -a "$REPORT/summary.md"
          cat "$REPORT/instrumented-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify E2E evidence and stop local servers
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/poc-report"
          mkdir -p "$REPORT/e2e"
          FAIL=0

          E2E_XML="$(find app/build/outputs/androidTest-results -name '*VpnTunnelE2ETest*.xml' 2>/dev/null | head -1 || true)"
          if [ -z "$E2E_XML" ]; then
            echo "E2E_XML_MISSING" | tee "$REPORT/e2e/result.txt"
            FAIL=1
          else
            cp "$E2E_XML" "$REPORT/e2e/VpnTunnelE2ETest.xml"
            grep -h "<testsuite " "$E2E_XML" | tee "$REPORT/e2e/testsuite.txt"
            python3 - "$E2E_XML" <<'PY' || FAIL=1
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          if suite is None:
              print("E2E_NO_TESTSuite")
              sys.exit(1)
          tests = int(suite.get("tests", "0"))
          failures = int(suite.get("failures", "0"))
          errors = int(suite.get("errors", "0"))
          skipped = int(suite.get("skipped", "0"))
          print(f"E2E tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if tests < 3 or failures or errors or skipped:
              sys.exit(1)
          PY
          fi

          if [ -f "$E2E_DIR/xray.pid" ]; then kill "$(cat "$E2E_DIR/xray.pid")" 2>/dev/null || true; fi
          if [ -f "$E2E_DIR/services.pid" ]; then kill "$(cat "$E2E_DIR/services.pid")" 2>/dev/null || true; fi
          sleep 1
          for f in services.log xray-server.log access.log xray-version.txt server.json token.txt; do
            cp "$E2E_DIR/$f" "$REPORT/e2e/$f" 2>/dev/null || true
          done
          sudo ip addr del "$E2E_ANSWER_IP/32" dev lo 2>/dev/null || true

          if [ -s "$REPORT/e2e/access.log" ] && grep -q "$E2E_ANSWER_IP:$E2E_HTTP_PORT" "$REPORT/e2e/access.log"; then
            echo "ACCESS_LOG_PROVES_TUNNEL_DESTINATION" | tee -a "$REPORT/e2e/result.txt"
          else
            echo "ACCESS_LOG_MISSING_TUNNEL_DESTINATION" | tee -a "$REPORT/e2e/result.txt"
            FAIL=1
          fi

          {
            echo ""
            echo "## E2E réel — Xray-core officiel local"
            echo "- Xray-core épinglé : \`$(cat "$GITHUB_WORKSPACE/xray-core-commit.txt" 2>/dev/null || echo n/a)\`"
            echo "- Version : \`$(cat "$REPORT/e2e/xray-version.txt" 2>/dev/null || echo n/a)\`"
            echo '```'
            cat "$REPORT/e2e/testsuite.txt" 2>/dev/null || echo "n/a"
            cat "$REPORT/e2e/result.txt" 2>/dev/null || true
            echo '```'
            echo "### Journal d'accès du serveur Xray (extrait)"
            echo '```'
            tail -20 "$REPORT/e2e/access.log" 2>/dev/null || echo "n/a"
            echo '```'
          } > "$REPORT/e2e/summary.md"
          cat "$REPORT/e2e/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$FAIL"

      - name: Collect build reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/poc-report/gradle"
          cp -r app/build/reports "$GITHUB_WORKSPACE/poc-report/gradle/reports" 2>/dev/null || true
          cp -r app/build/test-results "$GITHUB_WORKSPACE/poc-report/gradle/test-results" 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results "$GITHUB_WORKSPACE/poc-report/gradle/androidTest-results" 2>/dev/null || true
          {
            echo "LIBXRAY_TAG=$LIBXRAY_TAG"
            echo "LIBXRAY_COMMIT=$LIBXRAY_COMMIT"
            echo "XRAY_CORE_TAG=$XRAY_CORE_TAG"
            echo "XRAY_CORE_COMMIT=$XRAY_CORE_COMMIT"
            echo "NDK_VERSION=$NDK_VERSION"
            echo "LIBXRAY_ANDROID_API=$LIBXRAY_ANDROID_API"
            echo "LIBXRAY_GOMOBILE_VERSION=$LIBXRAY_GOMOBILE_VERSION"
            echo "GO_VERSION=$GO_VERSION"
            echo "E2E_UUID=$E2E_UUID"
            echo "E2E_VLESS_PORT=$E2E_VLESS_PORT"
            echo "E2E_VMESS_PORT=$E2E_VMESS_PORT"
            echo "E2E_PROBE_URL=http://onfaa.test:$E2E_HTTP_PORT/token"
          } > "$GITHUB_WORKSPACE/poc-report/build-env.txt"

      - name: Upload PoC report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libxray-poc-report
          path: |
            poc-report
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
